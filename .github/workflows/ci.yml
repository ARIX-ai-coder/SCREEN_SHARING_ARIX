
name: CI
on: [push, pull_request, workflow_dispatch]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q backend/tests
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node --check web/app.js && node --check web/addr.js
      - name: Browser e2e (Chromium + simulated sender)
        run: |
          cd tests/e2e && npm install && npx playwright install --with-deps chromium
          bash ./run_e2e.sh 

  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      
- uses: android-actions/setup-android@v3
  with:
    cmdline-tools-version: 12266719
    accept-android-sdk-licenses: true
    packages: |
      platform-tools

      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests + debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: arix-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
