plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.arix.screenshare'
    compileSdk 35

    defaultConfig {
        applicationId 'com.arix.screenshare'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.3.0'
    }

    buildTypes {
        release {
            minifyEnabled false   // WebRTC uses JNI; enabling R8 needs keep rules that have not been tested
        }
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    // ComponentActivity + Activity Result API (was missing in Phase 2 -> compile error)
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Kept from Phase 2 so the org.webrtc API stays identical. Resolution is NOT verified in this repo's
    // history; see README "WebRTC dependency" for the maintained-fork fallback.
    implementation 'org.webrtc:google-webrtc:1.0.32006'

    testImplementation 'junit:junit:4.13.2'
}
